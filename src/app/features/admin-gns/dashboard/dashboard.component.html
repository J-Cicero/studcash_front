<div class="mb-6 animate-fade-in-up">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Dashboard</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1.5 font-medium">Vue d'ensemble du réseau GNS</p>
    </div>
  </div>
</div>

<!-- Main KPI Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5 animate-fade-in-up" style="animation-delay: 100ms;">
  <!-- Total Étudiants -->
  <app-kpi-card
    title="Total Étudiants"
    [value]="totalEtudiants"
    [isLoading]="isTotalEtudiantsLoading"
    [hasError]="totalEtudiantsError"
    iconSvgPath="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
    gradientClass="from-blue-500 to-blue-600"
    iconBgClass="bg-blue-500/10"
    shadowClass="shadow-blue-500/30"
    actionButtonText="Versement Étu."
    actionButtonRoute="/admin-gns/versements-etudiants"
  ></app-kpi-card>

  <!-- Boutiques Alerte Quota -->
  <app-kpi-card
    title="Alerte Quota Bout."
    [value]="lowQuotaBoutiques"
    [isLoading]="isLowQuotaBoutiquesLoading"
    [hasError]="lowQuotaBoutiquesError"
    iconSvgPath="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
    gradientClass="from-amber-400 to-orange-500"
    iconBgClass="bg-amber-500/10"
    shadowClass="shadow-orange-500/30"
    actionButtonText="Versement Bout."
    actionButtonRoute="/admin-gns/versements-boutiques"
  ></app-kpi-card>

  <!-- Liquidations en Attente -->
  <app-kpi-card
    title="Liquidations Attente"
    [value]="pendingLiquidations"
    suffix="FCFA"
    [isLoading]="isPendingLiquidationsLoading"
    [hasError]="pendingLiquidationsError"
    iconSvgPath="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
    gradientClass="from-purple-500 to-indigo-600"
    iconBgClass="bg-purple-500/10"
    shadowClass="shadow-purple-500/30"
  ></app-kpi-card>
</div>

<!-- Charts Section -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6 animate-fade-in-up" style="animation-delay: 300ms;">
  <div class="glass-panel rounded-2xl p-5 shadow-lg">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-sm font-bold text-slate-900 dark:text-white">Transactions en volume</h3>
      <span class="text-[10px] font-extrabold text-slate-400 uppercase">Évolution mensuelle</span>
    </div>
    <div class="h-[340px] sm:h-[360px] relative w-full">
      <canvas #lineChartCanvas></canvas>
    </div>
  </div>

  <div class="glass-panel rounded-2xl p-5 shadow-lg">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-sm font-bold text-slate-900 dark:text-white">Répartition</h3>
      <span class="text-[10px] font-extrabold text-slate-400 uppercase">Flux GNS</span>
    </div>
    <div class="h-[340px] sm:h-[360px] relative w-full flex items-center justify-center">
      <canvas #pieChartCanvas></canvas>
    </div>
  </div>
</div>
