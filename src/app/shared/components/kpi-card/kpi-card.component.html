<div class="glass-panel rounded-2xl overflow-hidden hover-lift group h-full flex flex-col transition-all duration-300">
  <div class="p-4 sm:p-5 relative flex-grow flex flex-col justify-between">
    <div [class]="'absolute -right-6 -top-6 w-20 h-20 rounded-full blur-2xl transition-all duration-500 group-hover:opacity-100 opacity-40 ' + iconBgClass"></div>
    
    <div class="flex items-center justify-between">
      <div class="flex-1 pr-3">
        <dt class="text-[11px] uppercase font-bold tracking-wider text-slate-500 dark:text-slate-400 truncate mb-1">{{ title }}</dt>
        <dd class="flex items-baseline">
          <div *ngIf="isLoading" class="h-8 w-20 bg-slate-200 dark:bg-slate-700 rounded-lg animate-pulse"></div>
          
          <ng-container *ngIf="!isLoading">
            <div class="text-2xl font-black text-slate-900 dark:text-white tracking-tight flex items-center">
              <span *ngIf="hasError" class="text-amber-500 mr-1.5" title="Erreur API. Valeur par défaut affichée.">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
              </span>
              {{ formatNumberCompact(hasError ? 0 : value) }}
            </div>
            <span *ngIf="suffix && !hasError" class="ml-1.5 text-xs font-bold text-slate-500 dark:text-slate-400">{{ suffix }}</span>
          </ng-container>
        </dd>
      </div>

      <div [class]="'flex-shrink-0 rounded-xl p-2.5 shadow-md bg-gradient-to-br transition-transform group-hover:scale-105 duration-300 ' + gradientClass + ' ' + shadowClass">
        <svg class="h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="iconSvgPath" />
        </svg>
      </div>
    </div>
  </div>
  
  <div *ngIf="actionButtonText && actionButtonRoute" class="bg-slate-50/60 dark:bg-slate-800/30 px-4 py-2 border-t border-slate-100 dark:border-slate-800/80 flex justify-between items-center">
    <span class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">Action rapide</span>
    <a [routerLink]="actionButtonRoute" class="text-[10px] uppercase tracking-wider font-extrabold text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300 flex items-center group/btn cursor-pointer">
      {{ actionButtonText }}
      <svg class="ml-1 w-3 h-3 transform group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
    </a>
  </div>
</div>
